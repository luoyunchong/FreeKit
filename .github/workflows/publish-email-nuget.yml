name: Publish FreeKit Email NuGet Package

on:
  push:
    tags:
      - 'email-v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
        id: nuget-login

      - name: Restore
        run: dotnet restore src/IGeekFan.FreeKit.Email/IGeekFan.FreeKit.Email.csproj

      - name: Build
        run: dotnet build src/IGeekFan.FreeKit.Email/IGeekFan.FreeKit.Email.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/IGeekFan.FreeKit.Email/IGeekFan.FreeKit.Email.csproj --configuration Release --no-build --output ./nupkg/packages

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/packages/*.nupkg --skip-duplicate -s https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
